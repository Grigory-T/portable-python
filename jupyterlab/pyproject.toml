[project]
name = "portable-python-jupyterlab"
version = "0.1.4"
description = "General Windows target-resolved portable JupyterLab environment"
# Select one exact CPython version before the first START.bat run.
requires-python = "==3.13.18"
# User notebook libraries belong here. Empty means no additional libraries.
dependencies = []

# Mandatory notebook infrastructure; not part of the user-library list.
[dependency-groups]
jupyter = [
    "jupyterlab==4.6.4",
    "ipykernel==7.4.0",
]

[tool.uv]
package = false
default-groups = ["jupyter"]
required-version = "==0.13.6"

[tool.portable-python]
uv-archive-sha256 = "a2a8820d5eea32f08ef467ef3b7f66883a9b076d5737a2fc2fbb5f458d1bb50f"
uv-exe-sha256 = "81ea623608f8c17720c62efd0a380a8ead380c4d365ba6968e9d279a2319c674"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
