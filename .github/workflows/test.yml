name: Build and Windows acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the source-only ZIPs
        run: python scripts/build.py
      - name: Workspace cleanup safeguards
        shell: powershell
        run: ./tests/workspace-cleanup.ps1
      - name: Application acceptance
        shell: powershell
        run: ./tests/application.ps1 -Zip ./dist/portable-python-one-launcher-0.1.5-windows-x86_64.zip -Audit -BlockNetwork
      - name: JupyterLab acceptance
        shell: powershell
        run: ./tests/jupyterlab.ps1 -Zip ./dist/portable-python-jupyterlab-0.1.4-windows-x86_64.zip -Audit
  preloaded:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the preloaded starter ZIP
        run: python scripts/build.py --profile preloaded
      - name: Check wheel tag prefilter
        run: python -B tests/wheel-tags.py
      - name: Prepare, add app before packaging, and launch offline from a different path
        shell: powershell
        run: ./tests/preloaded.ps1 -Zip ./dist/portable-python-preloaded-0.1.8-windows-x86_64.zip -BlockNetwork
